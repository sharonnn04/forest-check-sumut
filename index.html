<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#176b3a">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Forest Check Sumatera Utara</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f5f7f6;
      font-family: Arial, Helvetica, sans-serif;
    }

    .app-shell {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #f5f7f6;
    }

    #loading {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      background: #f5f7f6;
      color: #176b3a;
      transition: opacity .25s ease, visibility .25s ease;
    }

    #loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 4px solid #dce8e1;
      border-top-color: #176b3a;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-title {
      font-weight: 700;
      font-size: 15px;
    }

    .loading-subtitle {
      font-size: 12px;
      color: #64748b;
      text-align: center;
      padding: 0 20px;
    }

    #forestApp {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    .fallback {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 3;
      display: none;
      background: rgba(255,255,255,.96);
      border: 1px solid #dbe5df;
      border-radius: 10px;
      padding: 10px 12px;
      box-shadow: 0 8px 28px rgba(15,23,42,.12);
      font-size: 12px;
      color: #475569;
    }

    .fallback a {
      color: #176b3a;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <div id="loading" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <div class="loading-title">Forest Check Sumatera Utara</div>
      <div class="loading-subtitle">Memuat aplikasi...</div>
    </div>

    <iframe
      id="forestApp"
      src="https://script.google.com/macros/s/AKfycbyQum86Hjxgzv_i5Je3rL07ENg4JODsrFwo84zDV13ExXwqlQxFo434L5iDIcLUqs6_/exec"
      title="Forest Check Sumatera Utara"
      allow="clipboard-read; clipboard-write; geolocation"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>

    <div class="fallback" id="fallback">
      Jika aplikasi tidak tampil, <a href="https://script.google.com/macros/s/AKfycbyQum86Hjxgzv_i5Je3rL07ENg4JODsrFwo84zDV13ExXwqlQxFo434L5iDIcLUqs6_/exec" target="_blank" rel="noopener noreferrer">buka aplikasi</a>.
    </div>
  </main>

  <script>
    (function () {
      var frame = document.getElementById('forestApp');
      var loading = document.getElementById('loading');
      var fallback = document.getElementById('fallback');

      frame.addEventListener('load', function () {
        loading.classList.add('hidden');
      });

      window.setTimeout(function () {
        if (!loading.classList.contains('hidden')) {
          fallback.style.display = 'block';
        }
      }, 12000);
    })();
  </script>
</body>
</html>
